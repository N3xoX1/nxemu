version: 1.0.{build}
image: Visual Studio 2022
platform:
- x64
configuration:
- Release

environment:
  SCCACHE_DIR: C:\nxemu-sccache
  # Leave room for the Vulkan SDK installer within the cache quota.
  SCCACHE_CACHE_SIZE: 512M
  SCCACHE_IDLE_TIMEOUT: '0'
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  NXEMU_BUILD_JOBS: '4'

cache:
  - VulkanSDK.exe
  - C:\nxemu-sccache

install:
  - if not exist VulkanSDK.exe curl -L --silent --show-error --output VulkanSDK.exe https://sdk.lunarg.com/sdk/download/1.3.268.0/windows/VulkanSDK-1.3.268.0-Installer.exe
  - VulkanSDK.exe --accept-licenses --default-answer --confirm-command install
  - set PATH=C:/VulkanSDK/1.3.268.0/Bin;%PATH%
  - ps: ./src/script/setup_sccache_windows.ps1
  
before_build:
- ps: >-
    If ($env:APPVEYOR_BUILD_VERSION -Like "1.0*") {
      $version = src/script/set_git_properties.cmd
      appveyor UpdateBuild -Version $version
    }
- cmd: git submodule update --init --recursive
build_script:
- ps: ./src/script/build_windows.ps1 Release
after_build:
- src/script/package_zip.cmd %APPVEYOR_BUILD_VERSION%-%platform%.zip %platform%
- cmd: 7z a -tzip "package\%APPVEYOR_BUILD_VERSION%-%platform%-symbols.zip" "bin\%platform%\Release\*.pdb" "build\windows-x64-ninja\modules\%platform%\Release\*\*.pdb"

artifacts:
- path: package/*.zip

on_finish:
- cmd: sccache --show-stats
- cmd: sccache --stop-server
