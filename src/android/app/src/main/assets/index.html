<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="ui.css">
  <script src="ui.js"></script>
</head>
<body>
  <div id="gamesPage" class="page">
    <div class="topbar">
      <div class="logo"><img src="file:///android_asset/nxlogo-32x32.png" width="20" height="20" alt="">NxEmu</div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" aria-label="Refresh library" onclick="refreshGameList()">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.2"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="settings-btn" type="button" aria-label="Settings" onclick="NxEmu.openSettings()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </div>
    <div id="libraryStatus" class="library-status"></div>
    <div id="gameList" class="game-list"></div>
    <div class="browser-hint">
      <span id="playHint" hidden>Press <span class="hint-key">A</span> <span class="hint-action">to play</span></span>
      <span id="settingsHint" hidden>Press <span class="hint-key">Y</span> <span class="hint-action">to open settings</span></span>
      <span id="touchHint">Tap a game <span class="hint-action">to play</span></span>
    </div>
  </div>
<script>
applyTheme();
applyControllerBrowser();
refreshGameList();
</script>
</body>
</html>
