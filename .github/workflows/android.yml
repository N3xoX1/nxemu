name: Android
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  # Let master runs finish so they save the shared caches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      NXEMU_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        if: ${{ !env.ACT }}
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle.kts
            src/android/gradle/wrapper/gradle-wrapper.properties
            src/android/app/build.gradle.kts
      - uses: android-actions/setup-android@v3
        if: ${{ !env.ACT }}
        with:
          # The obsolete 'tools' package is no longer published by Google.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        id: build-tools
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            command -v ccache >/dev/null || brew install ccache
            command -v glslangValidator >/dev/null || brew install glslang
          else
            missing=()
            command -v ccache >/dev/null || missing+=(ccache)
            command -v glslangValidator >/dev/null || missing+=(glslang-tools)
            if [ "${#missing[@]}" -gt 0 ]; then
              sudo apt-get update
              sudo apt-get install -y "${missing[@]}"
            fi
          fi
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          packages=()
          [ -s "$ANDROID_HOME/platforms/android-36/android.jar" ] || packages+=('platforms;android-36')
          [ -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ] || packages+=('build-tools;36.0.0')
          [ -s "$ANDROID_HOME/ndk/30.0.16248370/source.properties" ] && [ -f "$ANDROID_HOME/ndk/30.0.16248370/build/cmake/android.toolchain.cmake" ] || packages+=('ndk;30.0.16248370')
          [ -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ] || packages+=('cmake;3.22.1')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo 'Using the installed Android toolchain'
          elif command -v sdkmanager >/dev/null; then
            sdkmanager "${packages[@]}"
          else
            echo 'sdkmanager is required to install missing Android toolchain packages' >&2
            exit 1
          fi
      - name: Prepare build cache paths
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          build_directory="${NXEMU_BUILD_DIRECTORY:-build/android}"
          case "$build_directory" in
            /*) ;;
            *) build_directory="$PWD/$build_directory" ;;
          esac
          mkdir -p "$build_directory"
          {
            echo "NXEMU_EFFECTIVE_BUILD_DIRECTORY=$build_directory"
            echo "CCACHE_DIR=$build_directory/ccache"
            echo "CCACHE_BASEDIR=$PWD"
            echo "NXEMU_THINLTO_CACHE_DIR=$build_directory/thinlto-cache"
          } >> "$GITHUB_ENV"
      - name: Identify cache toolchain
        id: toolchain
        run: |
          fingerprint=$( { cat "$ANDROID_HOME/ndk/30.0.16248370/source.properties"; ccache --version; uname -s; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache_epoch=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore native build caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.NXEMU_THINLTO_CACHE_DIR }}
          # Immutable daily snapshots, written only on master.
          key: android-arm64-release-v1-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-daily-${{ steps.toolchain.outputs.cache_epoch }}
          restore-keys: |
            android-arm64-release-v1-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-daily-
            android-arm64-release-v1-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Build APK
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: sh src/script/build_android.sh Release "${NXEMU_BUILD_DIRECTORY:-build/android}"
      - name: Test Android project
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}/src/android
        run: sh ./gradlew :app:testReleaseUnitTest --build-cache "-PnxemuBuildDirectory=$NXEMU_EFFECTIVE_BUILD_DIRECTORY"
      - name: Check APK native libraries
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: python3 src/script/check_android_apk.py "${NXEMU_BUILD_DIRECTORY:-build/android}"/app/outputs/apk/release/*.apk
      - name: Compiler cache statistics
        if: ${{ always() && steps.build-tools.outcome == 'success' }}
        run: |
          ccache --show-stats --verbose
          du -sh "$CCACHE_DIR" "$NXEMU_THINLTO_CACHE_DIR" 2>/dev/null || true
      - name: Save compiler cache
        if: ${{ github.ref == 'refs/heads/master' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.NXEMU_THINLTO_CACHE_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: NxEmu-android-arm64
          path: ${{ env.NXEMU_EFFECTIVE_BUILD_DIRECTORY }}/app/outputs/apk/release/*.apk
          if-no-files-found: error
