name: Linux
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      NXEMU_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake ninja-build pkg-config ccache glslang-tools libsdl2-dev libdbus-1-dev libvulkan-dev libwayland-dev libasound2-dev libpulse-dev libusb-1.0-0-dev python3
      - name: Prepare build cache paths
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          build_directory="${NXEMU_BUILD_DIRECTORY:-build/linux}"
          case "$build_directory" in
            /*) ;;
            *) build_directory="$PWD/$build_directory" ;;
          esac
          mkdir -p "$build_directory"
          {
            echo "CCACHE_DIR=$build_directory/ccache"
            echo "CCACHE_BASEDIR=$PWD"
            echo "NXEMU_THINLTO_CACHE_DIR=$build_directory/thinlto-cache"
          } >> "$GITHUB_ENV"
      - name: Identify cache toolchain
        id: toolchain
        run: |
          fingerprint=$( { clang --version; ld.lld --version; cmake --version; ninja --version; ccache --version; } | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.NXEMU_THINLTO_CACHE_DIR }}
          key: linux-x64-release-v1-${{ steps.toolchain.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            linux-x64-release-v1-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Build
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: >-
          sh src/script/build_linux.sh Release "${NXEMU_BUILD_DIRECTORY:-build/linux}"
          -DNXEMU_USE_CCACHE=ON -DNXEMU_USE_SCCACHE=OFF
          -DNXEMU_THINLTO_CACHE_DIR="$NXEMU_THINLTO_CACHE_DIR"
          -DNXEMU_BUILD_UI_SETTINGS_TESTS=ON
      - name: Test
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          cmake --build "${NXEMU_BUILD_DIRECTORY:-build/linux}" --target nxemu_ui_settings_tests --parallel "$NXEMU_BUILD_JOBS"
          ctest --test-dir "${NXEMU_BUILD_DIRECTORY:-build/linux}" --output-on-failure
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats --verbose
      - name: Package
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          mkdir -p package
          tar -C bin/x64/Release -czf package/NxEmu-linux-x64.tar.gz nxemu nxemu.lang modules ui
      - name: Package AppImage from the existing Release build
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          bash src/script/build-appimage.sh --skip-build
          cp build/appimage/NxEmu-x86_64.AppImage package/
      - name: Check AppImage contents and runtime dependencies
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          image="$PWD/package/NxEmu-x86_64.AppImage"
          check_dir=$(mktemp -d)
          trap 'rm -rf "$check_dir"' EXIT
          cd "$check_dir"
          "$image" --appimage-extract >/dev/null
          app="$check_dir/squashfs-root/usr/bin"
          test -x "$app/nxemu"
          test -s "$app/nxemu.lang"
          test -s "$app/ui/main_window.rml"
          export LD_LIBRARY_PATH="$check_dir/squashfs-root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          binaries=("$app/nxemu" "$app/modules/loader/libnxemu-loader.so"
            "$app/modules/cpu/libnxemu-cpu.so" "$app/modules/video/libnxemu-video.so"
            "$app/modules/operating_system/libnxemu-os.so")
          for binary in "${binaries[@]}"; do
            test -s "$binary"
            dependencies=$(ldd "$binary")
            printf '%s\n' "$dependencies"
            if [[ "$dependencies" == *"not found"* ]]; then
              echo "Missing runtime dependency for $binary" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NxEmu-linux-x64
          path: |
            ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}/package/NxEmu-linux-x64.tar.gz
            ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}/package/NxEmu-x86_64.AppImage
          if-no-files-found: error
