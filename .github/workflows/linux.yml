name: Linux
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  # Let master runs finish so they save the shared caches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      NXEMU_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0
          submodules: recursive
      # The runner mirror is sometimes very slow: downloaded packages are cached, and a download
      # that stalls is retried on the main Ubuntu archive.
      - name: Restore apt packages
        id: apt-cache
        if: ${{ !env.ACT }}
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-v2-${{ github.run_id }}
          restore-keys: |
            apt-ubuntu-24.04-v2-
      - name: Install build tools
        id: apt-packages
        timeout-minutes: 30
        run: |
          packages=(build-essential clang libclang-rt-dev lld cmake ninja-build pkg-config ccache glslang-tools libdbus-1-dev libvulkan-dev libwayland-dev libegl-dev libxkbcommon-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libusb-1.0-0-dev python3)
          archives="$HOME/apt-archives"
          mkdir -p "$archives/partial"
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::Archives="$archives")
          # apt's timeouts only catch a mirror that stops, not one that is very slow
          download_packages() {
            timeout 6m sudo apt-get "${apt_options[@]}" update --error-on=any &&
              timeout 6m sudo apt-get "${apt_options[@]}" install -y --download-only "${packages[@]}"
          }
          # Avoid contacting mirrors when all required packages are already installed.
          all_installed=true
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)" != installed ]; then
              all_installed=false
              break
            fi
          done
          if [ "$all_installed" = true ]; then
            echo 'All required packages are already installed'
            exit 0
          fi
          if ! download_packages; then
            echo "::warning::apt download failed or stalled, retrying on archive.ubuntu.com"
            # The runner images list their mirrors in apt-mirrors.txt, the regional one first
            sudo sed -i -E 's#//[^/ ]+\.archive\.ubuntu\.com/#//archive.ubuntu.com/#g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            download_packages
          fi
          sudo apt-get "${apt_options[@]}" install -y "${packages[@]}"
          sudo apt-get "${apt_options[@]}" autoclean
          sudo chown -R "$(id -un)" "$archives"
          echo "key=apt-ubuntu-24.04-v2-$(find "$archives" -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save apt packages
        if: ${{ !env.ACT && github.ref == 'refs/heads/master' && steps.apt-packages.outputs.key != '' && steps.apt-packages.outputs.key != steps.apt-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-packages.outputs.key }}
      - name: Prepare build cache paths
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          build_directory="${NXEMU_BUILD_DIRECTORY:-build/linux}"
          case "$build_directory" in
            /*) ;;
            *) build_directory="$PWD/$build_directory" ;;
          esac
          mkdir -p "$build_directory"
          {
            echo "CCACHE_DIR=$build_directory/ccache"
            echo "CCACHE_BASEDIR=$PWD"
            echo "NXEMU_THINLTO_CACHE_DIR=$build_directory/thinlto-cache"
          } >> "$GITHUB_ENV"
      - name: Identify cache toolchain
        id: toolchain
        run: |
          fingerprint=$( { clang --version; ld.lld --version; cmake --version; ninja --version; ccache --version; } | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "cache_epoch=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore build caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.NXEMU_THINLTO_CACHE_DIR }}
          # Immutable daily snapshots, written only on master.
          key: linux-x64-release-v1-${{ steps.toolchain.outputs.fingerprint }}-daily-${{ steps.toolchain.outputs.cache_epoch }}
          restore-keys: |
            linux-x64-release-v1-${{ steps.toolchain.outputs.fingerprint }}-daily-
            linux-x64-release-v1-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Build
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: >-
          sh src/script/build_linux.sh Release "${NXEMU_BUILD_DIRECTORY:-build/linux}"
          -DNXEMU_USE_CCACHE=ON -DNXEMU_USE_SCCACHE=OFF
          -DNXEMU_THINLTO_CACHE_DIR="$NXEMU_THINLTO_CACHE_DIR"
          -DNXEMU_BUILD_UI_SETTINGS_TESTS=ON
          -DNXEMU_BUILD_TESTS=ON -DNXEMU_BUILD_PLATFORM_TESTS=OFF
      - name: Test
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          cmake --build "${NXEMU_BUILD_DIRECTORY:-build/linux}" --target nxemu_ui_settings_tests nxemu_linux_unit_tests --parallel "$NXEMU_BUILD_JOBS"
          ctest --test-dir "${NXEMU_BUILD_DIRECTORY:-build/linux}" --output-on-failure --no-tests=error -L '^linux_ci$'
      - name: Compiler cache statistics
        if: ${{ always() }}
        run: |
          ccache --show-stats --verbose
          du -sh "$CCACHE_DIR" "$NXEMU_THINLTO_CACHE_DIR" 2>/dev/null || true
      - name: Save compiler cache
        if: ${{ github.ref == 'refs/heads/master' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.NXEMU_THINLTO_CACHE_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Package
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          mkdir -p package
          # The bundled mods: each game's folder in the mods repo is named "<game> [<title id>]".
          mkdir -p build/package/mods
          cp -a external/nxemu-switch-mods/*\] build/package/mods/
          # The executable loads SDL by its soname, beside it.
          tar -C bin/x64/Release --dereference -czf package/NxEmu-linux-x64.tar.gz nxemu libSDL3.so.0 nxemu.lang modules ui -C ../../../config game_defaults.json -C ../build/package mods
          tar -tzf package/NxEmu-linux-x64.tar.gz game_defaults.json
      - name: Package AppImage from the existing Release build
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          bash src/script/build-appimage.sh --skip-build
          cp build/appimage/NxEmu-x86_64.AppImage package/
      - name: Check AppImage contents and runtime dependencies
        working-directory: ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}
        run: |
          image="$PWD/package/NxEmu-x86_64.AppImage"
          check_dir=$(mktemp -d)
          trap 'rm -rf "$check_dir"' EXIT
          cd "$check_dir"
          "$image" --appimage-extract >/dev/null
          app="$check_dir/squashfs-root/usr/bin"
          test -x "$app/nxemu"
          test -s "$app/nxemu.lang"
          test -s "$app/game_defaults.json"
          test -s "$app/ui/main_window.rml"
          test -s "$check_dir/squashfs-root/usr/lib/libSDL3.so.0"
          export LD_LIBRARY_PATH="$check_dir/squashfs-root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          binaries=("$app/nxemu" "$app/modules/loader/libnxemu-loader.so"
            "$app/modules/cpu/libnxemu-cpu.so" "$app/modules/video/libnxemu-video.so"
            "$app/modules/operating_system/libnxemu-os.so")
          for binary in "${binaries[@]}"; do
            test -s "$binary"
            dependencies=$(ldd "$binary")
            printf '%s\n' "$dependencies"
            if [[ "$dependencies" == *"not found"* ]]; then
              echo "Missing runtime dependency for $binary" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NxEmu-linux-x64
          path: |
            ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}/package/NxEmu-linux-x64.tar.gz
            ${{ env.NXEMU_LOCAL_WORKSPACE || github.workspace }}/package/NxEmu-x86_64.AppImage
          if-no-files-found: error
