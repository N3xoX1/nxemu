name: Cache maintenance

on:
  pull_request_target:
    types: [closed]
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report candidates without deleting caches'
        type: boolean
        default: true

permissions:
  actions: write
  pull-requests: read

# A group holds one pending run: give each closed PR its own so none is dropped.
concurrency:
  group: nxemu-cache-maintenance-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  prune:
    # This privileged workflow must never check out or execute pull request code.
    if: ${{ github.event_name == 'pull_request_target' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Prune obsolete cache entries
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import urllib.parse

          repo = os.environ['GITHUB_REPOSITORY']
          event = os.environ['GITHUB_EVENT_NAME']
          dry_run = os.environ['DRY_RUN'].lower() == 'true'
          master_ref = 'refs/heads/master'
          compiler_key = re.compile(
              r'^(macos-arm64-release-v2|windows-x64-release-v1|'
              r'linux-x64-release-v1|android-arm64-release-v1-Linux)-'
              r'([0-9a-f]{64})-(?:[0-9a-f]{40}|daily-\d{4}-\d{2}-\d{2})$'
          )
          pr_ref = re.compile(r'^refs/pull/([1-9][0-9]*)/merge$')

          def api(endpoint, *args):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', endpoint, *args], text=True
              ))

          def list_caches(ref=None):
              params = {'per_page': 100}
              if ref is not None:
                  params['ref'] = ref
              query = urllib.parse.urlencode(params)
              pages = api(f'repos/{repo}/actions/caches?{query}', '--paginate', '--slurp')
              return [cache for page in pages for cache in page['actions_caches']]

          deleted = 0
          reclaimed = 0

          def delete(cache):
              global deleted, reclaimed
              cache_id = int(cache['id'])
              print(f'{"Would delete" if dry_run else "Deleting"} cache {cache_id} '
                    f'{cache["key"]} on {cache["ref"]} ({cache["size_in_bytes"]} bytes)')
              if not dry_run:
                  result = subprocess.run(
                      ['gh', 'api', '--method', 'DELETE',
                       f'repos/{repo}/actions/caches/{cache_id}'],
                      capture_output=True, text=True,
                  )
                  # GitHub may have evicted this cache since the listing was read.
                  if result.returncode:
                      if '(HTTP 404)' in result.stderr:
                          return
                      raise RuntimeError(f'Cache deletion failed for ID {cache_id}')
              deleted += 1
              reclaimed += int(cache['size_in_bytes'])

          def prune_closed_pr(number, caches):
              # Recheck the state: a pull request may have been reopened.
              try:
                  state = api(f'repos/{repo}/pulls/{number}')['state']
              except subprocess.CalledProcessError:
                  print(f'::warning::Could not read the state of pull request {number}')
                  return
              if state != 'closed':
                  return
              ref = f'refs/pull/{number}/merge'
              for cache in caches:
                  if cache['ref'] == ref:
                      delete(cache)

          if event == 'pull_request_target':
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
                  number = int(json.load(stream)['pull_request']['number'])
              prune_closed_pr(number, list_caches(f'refs/pull/{number}/merge'))
          else:
              # Take a paginated snapshot before deleting anything.
              caches = list_caches()
              groups = collections.defaultdict(list)
              pull_requests = collections.defaultdict(list)
              for cache in caches:
                  ref = cache['ref']
                  if ref == master_ref:
                      match = compiler_key.fullmatch(cache['key'])
                      if match:
                          groups[match[1], match[2]].append(cache)
                  else:
                      match = pr_ref.fullmatch(ref)
                      if match:
                          pull_requests[int(match[1])].append(cache)

              # Keep the two newest compiler snapshots per platform and toolchain,
              # legacy SHA keys included: runner images roll out gradually, so two
              # toolchains can be live at once. A toolchain no job uses any more
              # expires after GitHub's 7 days without access. Never prune
              # dependency caches.
              for group in groups.values():
                  group.sort(key=lambda c: (c['created_at'], int(c['id'])), reverse=True)
                  for cache in group[2:]:
                      delete(cache)

              # Recover caches from PRs closed before this workflow was installed,
              # or whose close event was skipped. Leave open PR caches untouched.
              for number, entries in pull_requests.items():
                  prune_closed_pr(number, entries)

          print(f'{"Candidates" if dry_run else "Deleted"}: {deleted}; '
                f'bytes {"eligible" if dry_run else "reclaimed"}: {reclaimed}')
          PY
